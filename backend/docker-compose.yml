# Uso típico en local: solo la base de datos.
#   docker compose up -d postgres
# Stack completo:
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: uxflow-postgres
    environment:
      POSTGRES_DB: uxflow
      POSTGRES_USER: uxflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uxflow_local}
    ports:
      # Puerto del HOST configurable: si ya tienes un Postgres local en 5432,
      # define DB_PORT en backend/.env (por ejemplo 5433). Dentro de la red de
      # Docker el puerto siempre es 5432.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uxflow -d uxflow" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Contexto en la raíz del repo: el build necesita backend/ y database/
    # (las migraciones se empaquetan desde database/migrations).
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: uxflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Docker Compose se utiliza únicamente para desarrollo.
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/uxflow
      DB_USER: uxflow
      DB_PASSWORD: ${DB_PASSWORD:-uxflow_local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Mínimo 32 caracteres: JwtServiceImpl corta el arranque si es más corto.
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-local-minimo-32-caracteres}
      # Opcionales en local. Vacías, la app arranca, pero no funcionan
      # el login con Google, el envío de emails ni el webhook de Brevo.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_WEBHOOK_SECRET: ${BREVO_WEBHOOK_SECRET:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
    ports:
      - "8080:8080"

volumes:
  pgdata: